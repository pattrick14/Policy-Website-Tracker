[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "policy-website-tracker"
version = "0.0.0"
description = "Weekly tracker for policy-relevant publications on selected Indian government websites"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "PyYAML>=6.0.2",
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pypdf>=5.0",
]

[project.scripts]
policy-tracker = "policy_tracker.operations.cli:main"
policy-tracker-inventory = "policy_tracker.inventory:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/policy_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
