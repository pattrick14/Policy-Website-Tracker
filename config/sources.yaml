        fixtures: [tests/fixtures/ministry_of_coal/acts_rules_policies.html]
        last_verified: '2026-10-22'
      - scope: Major Statistics publication tables; feeds coal_monthly_statistics, coal_statistical_reports, coal_quarterly_reports, coal_rsr_reports, coal_coal_statistics
