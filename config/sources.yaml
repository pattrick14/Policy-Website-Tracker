  - id: cerc
    name: Central Electricity Regulatory Commission
    base_url: https://cercind.gov.in/
    allowed_hosts:
      - cercind.gov.in
      - www.cercind.gov.in
    required_feed_ids:
      - cerc_sitemap
      - cerc_home
      - cerc_draft_regulations
      - cerc_current_regulations
      - cerc_discussion_papers
      - cerc_working_papers
      - cerc_study_reports
      - cerc_recent_orders
      - cerc_order_archives
      - cerc_recent_rops
      - cerc_rop_archives
      - cerc_market_monitoring
      - cerc_annual_reports
      - cerc_other_reports
      - cerc_public_hearings
      - cerc_hearing_schedule
      - cerc_public_notices
      - cerc_statutory_public_notices
      - cerc_statutory_advice
      - cerc_commission_minutes
      - cerc_cac_minutes
      - cerc_other_meeting_minutes
      - cerc_coordination_forum_minutes
      - cerc_price_indices
      - cerc_escalation_rates
    # D-020: connection-level failures fall back between the two
    # hosts, with bounded spaced retries and a run-level circuit breaker.
    request_rate_per_host_per_second: 1
    rate_limit_shared_across_hosts: true
    request_timeout_seconds: 120
    canonical_host: cercind.gov.in
    fallback_hosts: [www.cercind.gov.in]
    host_fallback_on: [connect_timeout, tls_handshake_timeout, read_timeout, connection_reset, empty_reply]
    max_attempts_per_url: 6
    retry_backoff_seconds: [20, 40]
    abort_after_consecutive_failed_urls: 3
    coverage_decisions:
      - scope: Rules & Regulations branch - current and draft regulations (Current_reg.html, Draft_reg.html)
        decision: track
        reason: Final and draft regulation matters are core policy publications and evolve with later Gazette, reasons, extension, comment, hearing, and presentation files.
        evidence_urls: [https://cercind.gov.in/site_map.html, https://cercind.gov.in/Current_reg.html, https://cercind.gov.in/Draft_reg.html]
        coverage_limit: Covered by cerc_current_regulations and cerc_draft_regulations; HTML child pages such as Comment-N-SM-YYYY.html and Presentation-N-SM-YYYY.html are part of those row contracts.
        refresh_policy: {weekly: feed contracts cerc_current_regulations and cerc_draft_regulations, historical: quarterly child-link comparison per feed contract}
        fixtures: [tests/fixtures/cerc/current_regulations.html, tests/fixtures/cerc/draft_regulations.html, tests/fixtures/cerc/site_map_branches.html]
        last_verified: '2026-10-22'
      - scope: Rules & Regulations branch - repealed regulations (Repeal_Reg.html)
        decision: exclude
        reason: Nineteen repealed-regulation matters (1999-2021) are historical and no longer operative; excluded as an independent feed by user decision D-019.
        evidence_urls: [https://cercind.gov.in/site_map.html, https://cercind.gov.in/Ind.html, https://cercind.gov.in/Repeal_Reg.html]
        coverage_limit: Repeal_Reg.html is not enumerated. Bulletin appearances of repealed-regulation items remain captured by cerc_home (D-001). A regulation leaving Current_reg.html is still observed by cerc_current_regulations, but its arrival on the repealed list and any file added only there are not captured.
        refresh_policy: {weekly: compare sitemap link set via cerc_sitemap}
        fixtures: [tests/fixtures/cerc/repealed_regulations.html]
        last_verified: '2026-10-22'
      - scope: Discussion, working, and study papers (Disc_Paper.html, Work_Paper.html, Study_Rep.html, Paper.html landing)
        decision: track
        reason: Consultation papers and studies are selected publication families; Paper.html is a link-only landing page for the three collections.
        evidence_urls: [https://cercind.gov.in/site_map.html, https://cercind.gov.in/Paper.html, https://cercind.gov.in/Disc_Paper.html]
        coverage_limit: Covered by cerc_discussion_papers, cerc_working_papers, and cerc_study_reports; the landing page holds no documents.
        refresh_policy: {weekly: feed contracts, landing: compare sitemap link set}
        fixtures: [tests/fixtures/cerc/discussion_papers.html, tests/fixtures/cerc/working_papers.html, tests/fixtures/cerc/study_reports.html]
        last_verified: '2026-10-22'
      - scope: Orders/ROP/TV branch - current-year and prior-year orders and records of proceedings, plus Hearing Schedule
        decision: track
        reason: Orders, ROPs, and cause lists are selected families; order_rop_head.html is an empty landing page and the homepage-only Recent Order & ROP link (recent_orders_rops.html) returned HTTP 404.
        evidence_urls: [https://cercind.gov.in/site_map.html, https://cercind.gov.in/order_rop_head.html, https://cercind.gov.in/recent_orders.html, https://cercind.gov.in/orders.html]
        coverage_limit: Covered by cerc_recent_orders, cerc_order_archives, cerc_recent_rops, cerc_rop_archives, and cerc_hearing_schedule; the dead recent_orders_rops.html link is recorded, not crawled.
