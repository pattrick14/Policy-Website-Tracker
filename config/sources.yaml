    coverage_decisions:
      # --- Tracked publication families (existing verified feeds) ---
      - scope: "What's New bulletin (/whats-new and homepage What's New block); feed coal_whats_new"
        decision: track
        reason: Broad bulletin of consultations, notices, indices, schemes, Gazette material, and meeting records. It is reached from the homepage block, not from the sitemap tree. Re-check 2026-10-23 found a 41-page pager (?page=0..40, 2042 rows back to 2000), not a single 50-row table.
        evidence_urls: [https://www.coal.nic.in/whats-new, 'https://www.coal.nic.in/whats-new?page=40', https://www.coal.nic.in/]
        coverage_limit: Never removal authority. The baseline must enumerate every pager page. Items from untracked sections are captured only while they appear here. Tail rows are malformed at the source (year 0013, a linkless "test" row, empty dates) and are kept verbatim.
        refresh_policy: {weekly: pager pages from page=0 until a page holds only known hrefs (at least page=0 and page=1), historical: full pager enumeration monthly; never infer removal}
        fixtures: [tests/fixtures/ministry_of_coal/whats_new.html, tests/fixtures/ministry_of_coal/whats_new_paged.html, tests/fixtures/ministry_of_coal/whats_new_last_page.html]
