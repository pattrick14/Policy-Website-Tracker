        fixtures: [tests/fixtures/cerc/recent_orders.html, tests/fixtures/cerc/order_archives.html, tests/fixtures/cerc/recent_rops.html, tests/fixtures/cerc/rop_archives.html, tests/fixtures/cerc/hearing_schedule.html]
