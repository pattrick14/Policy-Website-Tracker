# Step 1 research inventory. Preliminary contracts block the completion gate.
schema_version: 1
defaults:
  timezone: Asia/Kolkata
  request_rate_per_host_per_second: 1
  request_timeout_seconds: 30
  max_redirects: 5
  max_document_bytes: 104857600
  language_policy: english_and_bilingual

contract_templates:
  coal_direct_table: &coal_direct_table
    discovery_method: sitemap
    kind: authoritative_collection
    decision: track
    enumeration: {method: single HTML attachment table, termination: end of table}
    identity: {native_ids: [attachment href], fallback: row provenance plus source-scoped canonical URL}
    date_semantics: {displayed: source row date or period label, first_seen: tracker discovery time}
    expected_mime_types: [text/html, application/pdf]
    language_behavior: Preserve English listing metadata; linked files may be English, Hindi, bilingual, scanned, or unreadable.
    refresh_policy: {weekly: full table, historical: full enumeration weekly}
    completeness:
      removal_authority: true
      failure_indicators: [missing page heading, missing attachment table, unexpected row-count collapse, block page]

sites:
  - id: ministry_of_power
    name: Ministry of Power
    base_url: https://www.powermin.gov.in/
    allowed_hosts:
      - www.powermin.gov.in
      - powermin.gov.in
    required_feed_ids: [mop_whats_new, mop_whats_new_archive, mop_document_taxonomy, mop_documents]
    coverage_decisions:
      - scope: Selected document collections (Documents menu and taxonomy roots reports, acts-and-policy, orders-and-notices, gazette-notifications, guidelines, publications; published status)
        decision: track
        reason: Approved Ministry of Power publication families (PROJECT_PLAN section 1); enumerated by feed mop_documents and validated by mop_document_taxonomy.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/global-information-architecture
          - https://www.powermin.gov.in/cms/wp-json/taxonomy/documents_category
          - https://www.powermin.gov.in/cms/wp-json/document/documents?document_category=reports&limit=50&page=1
        coverage_limit: Default enumeration returns only post_status=publish parents; archived parents need the separate archive-status decision below. Gazette Notifications, Guidelines, and Publications are currently empty (count 0).
        refresh_policy: {weekly: fully enumerate each root slug, historical: quarterly full parent rescan}
        fixtures:
          - tests/fixtures/ministry_of_power/taxonomy_full.json
          - tests/fixtures/ministry_of_power/navigation_menus.json
          - tests/fixtures/ministry_of_power/documents_page.json
          - tests/fixtures/ministry_of_power/documents_after_end.json
        last_verified: '2026-10-22'
      - scope: What's New bulletin (/whats-new route; post-page/whats_new published posts)
        decision: track
        reason: Approved cross-site rolling bulletin; feed mop_whats_new. Captures press releases, Parliament material, and other untracked-section items that are surfaced here.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/post-page/whats_new
        coverage_limit: Rolling feed of published posts only (26 at verification); never removal authority. Posts move to archive status and leave this response.
        refresh_policy: {weekly: full response, historical: not authoritative}
        fixtures:
          - tests/fixtures/ministry_of_power/whats_new.json
          - tests/fixtures/ministry_of_power/frontend_routes.json
        last_verified: '2026-10-22'
      - scope: What's New archive (post-page/whats_new?post_status=archive; Archives route)
        decision: track
        reason: Hidden publication path found in the frontend bundle; feed mop_whats_new_archive. It holds 637 archived bulletin posts that the rolling feed never exposes and that form part of the available history (D-001, D-006).
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/post-page/whats_new?post_status=archive
          - https://www.powermin.gov.in/cms/wp-json/post-page/whats_new?post_status=archive&limit=5&page=2
          - https://www.powermin.gov.in/cms/wp-json/count-posts/archive
        coverage_limit: Rotating archive without removal authority. Enumerated as one unparameterized response checked against total_items (limit/page give a paginated fallback). Post dates are CMS-migration artifacts and never publication dates.
        refresh_policy: {weekly: full single response, historical: silent baseline on first complete fetch}
        fixtures:
          - tests/fixtures/ministry_of_power/whats_new_archive.json
          - tests/fixtures/ministry_of_power/whats_new_archive_page.json
          - tests/fixtures/ministry_of_power/archive_counts.json
        last_verified: '2026-10-22'
      - scope: Archived document parents (Archives menu Reports, Orders and Notices, Acts and Policies, Gazettes Notifications, Publications; documents API with post_status=archive)
        decision: track
        reason: Archived parents of selected collections are excluded from the default enumeration and from taxonomy counts; covered by the archive-status pass of feed mop_documents. acts-and-policy currently has 2 archived parents, including an archived Electricity Act version.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/document/documents?document_category=acts-and-policy&limit=1&page=2&post_status=archive
          - https://www.powermin.gov.in/cms/wp-json/document/documents?document_category=acts-and-policy&limit=1&page=3&post_status=archive
          - https://www.powermin.gov.in/cms/wp-json/count-posts/archive
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/website-menu
        coverage_limit: Archive pass paginates like the published pass (total_pages; following page empty). A move between publish and archive is a status change, not a removal. Other selected roots currently return 0 archived parents.
        refresh_policy: {weekly: archive pass for every root slug, historical: quarterly full rescan of both passes}
        fixtures:
          - tests/fixtures/ministry_of_power/documents_archive_status.json
          - tests/fixtures/ministry_of_power/documents_archive_page.json
          - tests/fixtures/ministry_of_power/documents_archive_after_end.json
          - tests/fixtures/ministry_of_power/archive_counts.json
        last_verified: '2026-10-22'
      - scope: Child taxonomy terms of selected roots (general_acts, general-report, general_orders, general_gazettes, general_guidelines, general_publications)
        decision: indirect
        reason: Every observed child-term post also carries its root term, so root-slug enumeration returns it (reports 9 = general-report 7 + two Parliament-question children). Querying a child slug directly returns zero items.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/taxonomy/documents_category
          - https://www.powermin.gov.in/cms/wp-json/document/documents?document_category=reports&limit=50&page=1
          - https://www.powermin.gov.in/cms/wp-json/document/documents?document_category=general-report&limit=50&page=1
        coverage_limit: A post tagged only with a child term would be missed and the API offers no child-slug fallback. The mop_documents child-term reconciliation failure indicator flags when root-enumerated posts carrying a child term fall below that child's taxonomy count.
        refresh_policy: {weekly: compare child term counts with root-enumerated posts, historical: not applicable}
        fixtures:
          - tests/fixtures/ministry_of_power/taxonomy_full.json
          - tests/fixtures/ministry_of_power/documents_root_child_terms.json
          - tests/fixtures/ministry_of_power/documents_child_slug_empty.json
        last_verified: '2026-10-22'
      - scope: Press Release taxonomy root and child (press-release, general_press_release; /documents/press-release)
        decision: exclude
        reason: Outside the approved publication families; excluded as an independent feed by user decision D-013.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/document/documents?document_category=press-release&limit=3&page=1
          - https://www.powermin.gov.in/cms/wp-json/taxonomy/documents_category
        coverage_limit: No independent crawl of the 51 published (and 1 archived) press-release posts; What's New appearances are still captured.
        refresh_policy: {weekly: taxonomy validation only, historical: none}
        fixtures:
          - tests/fixtures/ministry_of_power/taxonomy_full.json
          - tests/fixtures/ministry_of_power/archive_counts.json
        last_verified: '2026-10-22'
      - scope: Parliament Question terms and page (lok-sabha- and rajya-sabha-parliament-questions-and-answer children of reports; /connect/parliament-questions)
        decision: exclude
        reason: Outside the approved publication families; excluded as an independent feed by user decision D-013.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/taxonomy/documents_category
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/website-menu
        coverage_limit: No independent feed; What's New appearances are still captured. Both current posts are also tagged reports, so mop_documents still captures them as Reports items under the capture-every-item rule.
        refresh_policy: {weekly: none beyond reports enumeration and taxonomy validation, historical: none}
        fixtures:
          - tests/fixtures/ministry_of_power/documents_root_child_terms.json
          - tests/fixtures/ministry_of_power/navigation_menus.json
        last_verified: '2026-10-22'
      - scope: Related Documents navigation entry (/documents/related-documents)
        decision: exclude
        reason: Menu entry with no backing taxonomy term; the documents API returns an empty result for the slug.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/global-information-architecture
          - https://www.powermin.gov.in/cms/wp-json/document/documents?document_category=related-documents&limit=5&page=1
        coverage_limit: If a related-documents term appears in the taxonomy it must be reviewed before it is tracked.
        refresh_policy: {weekly: taxonomy validation flags new terms, historical: none}
        fixtures:
          - tests/fixtures/ministry_of_power/navigation_menus.json
          - tests/fixtures/ministry_of_power/taxonomy_full.json
        last_verified: '2026-10-22'
      - scope: Attachment records (central_documents post type; post-page/post?id=)
        decision: indirect
        reason: File records are reached through attachment IDs on tracked parents and What's New posts.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/post-page/post?id=13695
          - https://www.powermin.gov.in/cms/wp-json/custom/api/search?s=electricity%20act
        coverage_limit: Attachment records not linked from any tracked parent or bulletin post are not enumerated; search exposes such records but is not a complete index.
        refresh_policy: {weekly: fetch newly referenced IDs and conditional checks, historical: quarterly validator recheck}
        fixtures:
          - tests/fixtures/ministry_of_power/attachment_detail.json
          - tests/fixtures/ministry_of_power/search_results.json
        last_verified: '2026-10-22'
      - scope: Site search (/search, /aisearch, custom/api/search)
        decision: exclude
        reason: Query-driven mixed-type results; used as a research cross-check for hidden publication paths, not as a feed.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/api/search?s=electricity%20act
        coverage_limit: Not an enumeration source. Result links point at the CMS backend host cms-powermin.digifootprint.gov.in, which is outside allowed_hosts.
        refresh_policy: {weekly: none, historical: optional manual diagnostic during inventory refresh}
        fixtures:
          - tests/fixtures/ministry_of_power/search_results.json
        last_verified: '2026-10-22'
      - scope: Ministry organisation pages (About Us, Our Team, Our Divisions, Our Departments, Our Performance, Directory; Archives Our Division)
        decision: exclude
        reason: Generic organisational and staff-directory content (PROJECT_PLAN section 1).
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/global-information-architecture
        coverage_limit: No independent crawl; What's New appearances remain captured.
        refresh_policy: {weekly: none, historical: menu review at inventory refresh}
        fixtures:
          - tests/fixtures/ministry_of_power/navigation_menus.json
        last_verified: '2026-10-22'
      - scope: Attached organisations, PSUs, Related Links, Important Links, and other outbound websites (Our Organisations, /RelatedLinks, /important-links)
        decision: exclude
        reason: External to the three-site boundary; outbound links only in v1.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/website-menu
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/footer-menu
        coverage_limit: Outbound links may be recorded when they appear on tracked items; external sites are not crawled.
        refresh_policy: {weekly: none, historical: menu review at inventory refresh}
        fixtures:
          - tests/fixtures/ministry_of_power/navigation_menus.json
        last_verified: '2026-10-22'
      - scope: Offerings programme pages (Schemes and Services, Competition and Awards, International Collaboration, Initiative; Archives Schemes and Initiatives)
        decision: exclude
        reason: Programme and scheme descriptions are not among the approved Ministry of Power publication families.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/global-information-architecture
        coverage_limit: No independent crawl; What's New appearances remain captured.
        refresh_policy: {weekly: none, historical: menu review at inventory refresh}
        fixtures:
          - tests/fixtures/ministry_of_power/navigation_menus.json
          - tests/fixtures/ministry_of_power/frontend_routes.json
        last_verified: '2026-10-22'
      - scope: Tenders and vacancies (Offerings Tenders and Vacancies; Archives Tenders and Vacancies)
        decision: exclude
        reason: Jobs and tenders do not become independent feeds (PROJECT_PLAN section 1).
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/website-menu
          - https://www.powermin.gov.in/cms/wp-json/count-posts/archive
        coverage_limit: No independent crawl of 110 archived tenders or 127 archived vacancies; What's New appearances remain captured.
        refresh_policy: {weekly: none, historical: none}
        fixtures:
          - tests/fixtures/ministry_of_power/navigation_menus.json
          - tests/fixtures/ministry_of_power/archive_counts.json
        last_verified: '2026-10-22'
      - scope: Media (Photos, Videos, Brochures, Presentations, gallery and presentation detail routes; Archives Photos, Videos, Brochures, Presentation)
        decision: exclude
        reason: Galleries and promotional media are excluded generic content (PROJECT_PLAN section 1).
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/global-information-architecture
        coverage_limit: No independent crawl; What's New appearances remain captured.
        refresh_policy: {weekly: none, historical: none}
        fixtures:
          - tests/fixtures/ministry_of_power/navigation_menus.json
          - tests/fixtures/ministry_of_power/frontend_routes.json
        last_verified: '2026-10-22'
      - scope: Connect pages (Contact Us, Directory, RTI and RTI Documents, Grievance Redressal, Citizen Engagement, Visitors Pass)
        decision: exclude
        reason: Contact, directory, RTI, grievance, and engagement-service content is generic administrative material. Citizen Engagement is backed by the public-consultation page, which holds only the bilingual Citizen's/Client's Charter.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/global-information-architecture
          - https://www.powermin.gov.in/cms/wp-json/wp/v2/pages?slug=public-consultation&acf_format=standard
          - https://www.powermin.gov.in/cms/wp-json/post-page/post?id=12224
        coverage_limit: Consultations are expected through What's New and selected collections. If the public-consultation page later lists consultation documents, they are not collected until a feed is added; the weekly growth check makes that visible.
        refresh_policy: {weekly: warn when the public-consultation page's public_consultation_repeat list has more than its one charter entry, historical: menu review at inventory refresh}
        fixtures:
          - tests/fixtures/ministry_of_power/navigation_menus.json
          - tests/fixtures/ministry_of_power/citizen_engagement_page.json
        last_verified: '2026-10-23'
      - scope: Website policies and utility routes (Terms, Privacy, Hyperlinking, Copyright, Cookie, Bhashini policies; help, HTML sitemap, feedback, cookies, profile, dashboard, persona, social feed, new-template, search-copy)
        decision: exclude
        reason: Site utility, legal, and template pages carry no policy publications.
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/footer-menu
          - https://www.powermin.gov.in/_next/static/CFzOpdsh5dnqm8hvr-SKu/_buildManifest.js
        coverage_limit: No crawl. The route list is tied to the current Next.js build ID and must be rechecked after a redeploy.
        refresh_policy: {weekly: none, historical: route-manifest review at inventory refresh}
        fixtures:
          - tests/fixtures/ministry_of_power/frontend_routes.json
          - tests/fixtures/ministry_of_power/navigation_menus.json
        last_verified: '2026-10-22'
      - scope: Homepage widgets and auxiliary APIs (top banner, popup, in-spotlight, infographics, swipe cards, persona cards, social feed, KPI, theme, chatbot)
        decision: exclude
        reason: Presentation widgets that duplicate or promote content; publication items are reached through What's New and the selected collections.
        evidence_urls:
          - https://www.powermin.gov.in/
          - https://www.powermin.gov.in/_next/static/chunks/pages/_app-ebc0dce5688a3d29.js
        coverage_limit: No crawl; in-spotlight items not also in What's New would be missed.
        refresh_policy: {weekly: none, historical: bundle review at inventory refresh}
        fixtures:
          - tests/fixtures/ministry_of_power/home_shell.html
          - tests/fixtures/ministry_of_power/frontend_routes.json
        last_verified: '2026-10-22'
      - scope: Navigation discovery sources (homepage HTML, misconfigured /sitemap.xml, disabled REST route index; substitutes are the custom/v1/menus APIs, the taxonomy API, and the build manifest)
        decision: exclude
        reason: The homepage is a client-rendered shell with no links, /sitemap.xml lists only meity.gov.in URLs, and /cms/wp-json/ returns rest_root_disabled. Navigation coverage instead rests on the three menu APIs, the documents taxonomy, and the route manifest.
        evidence_urls:
          - https://www.powermin.gov.in/sitemap.xml
          - https://www.powermin.gov.in/cms/wp-json/
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/website-menu
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/global-information-architecture
          - https://www.powermin.gov.in/cms/wp-json/custom/v1/menus/footer-menu
        coverage_limit: The menu APIs are not configured feeds, so new menu sections are detected only at inventory refresh unless a menu-diff check is added. Taxonomy validation detects new document terms weekly.
        refresh_policy: {weekly: taxonomy validation, historical: menu and sitemap recheck at inventory refresh}
        fixtures:
          - tests/fixtures/ministry_of_power/sitemap_misconfigured.xml
          - tests/fixtures/ministry_of_power/home_shell.html
          - tests/fixtures/ministry_of_power/rest_root_disabled.json
          - tests/fixtures/ministry_of_power/navigation_menus.json
        last_verified: '2026-10-22'
    research_status: complete
    feeds:
      - id: mop_whats_new
        purpose: Cross-site recent-publication bulletin used for discovery and coverage checks.
        url: https://www.powermin.gov.in/cms/wp-json/post-page/whats_new
        discovery_method: api
        kind: rolling
        decision: track
        enumeration: {method: API response, termination: response end}
        identity: {native_ids: [post id], fallback: source-scoped canonical URL}
        date_semantics: {displayed: publication date, first_seen: tracker discovery time}
        expected_mime_types: [application/json]
        language_behavior: English API metadata; linked documents may be English, Hindi, or bilingual.
        refresh_policy: {weekly: full response, historical: not authoritative}
        completeness:
          removal_authority: false
          failure_indicators: [HTTP block page, non-JSON response, malformed JSON]
        history: {boundary: current response contained 26 items and exposed total_items=26, boundary_verified: true}
        evidence_urls: [https://www.powermin.gov.in/cms/wp-json/post-page/whats_new]
        fixtures:
          - tests/fixtures/ministry_of_power/whats_new.json
          - tests/fixtures/ministry_of_power/browser_block.html
        verified: true
        last_verified: '2026-10-22'
      - id: mop_whats_new_archive
        purpose: Archived What's New bulletin posts that have left the rolling feed; establishes the available bulletin history (D-001, D-006).
        url: https://www.powermin.gov.in/cms/wp-json/post-page/whats_new?post_status=archive
        discovery_method: api
        kind: rotating_archive
        decision: track
        enumeration:
          method: Single unparameterized API response containing every archived post plus total_items; sending limit and page switches the endpoint to a paginated shape with total_pages and current_page, which is a fallback only
          termination: response end; the posts array length must equal total_items (fallback mode stops when current_page reaches total_pages and the following page is empty)
        identity: {native_ids: [post id, attachment post id], fallback: source-scoped canonical URL}
        date_semantics:
          displayed: none; archived posts carry no acf date field
          posted: post_date values cluster between 2025-06-21 and 2025-07-03 and are CMS-migration artifacts, never publication dates
          publication: prefer attachment/document metadata (attachment file_date or parent document date); leave publication date unknown when absent and never substitute post_date
          modified: API modified timestamp (observed 2025-06-28 to 2025-09-16)
          first_seen: tracker discovery time
        expected_mime_types: [application/json]
        language_behavior: English API metadata; linked documents may be English, Hindi, or bilingual. Preserve English listing metadata regardless of file language.
        refresh_policy: {weekly: full single response; new archive entries matched by post id to prior mop_whats_new appearances, historical: silent baseline on first complete fetch}
        completeness:
          removal_authority: false
          failure_indicators: [HTTP block page, non-JSON response, malformed JSON, posts length differs from total_items, row-count collapse over 50%]
          notes: A post moving from mop_whats_new to this archive is an appearance/status change for the same post id, not a new publication. Archive entries disappearing never establish removal.
        history: {boundary: 637 archived posts in one response (total_items=637; 128 pages at limit=5 in paginated mode with identical ordering), boundary_verified: true}
        evidence_urls:
          - https://www.powermin.gov.in/cms/wp-json/post-page/whats_new?post_status=archive
          - https://www.powermin.gov.in/cms/wp-json/post-page/whats_new?post_status=archive&limit=5&page=2
          - https://www.powermin.gov.in/cms/wp-json/count-posts/archive
        fixtures:
          - tests/fixtures/ministry_of_power/whats_new_archive.json
          - tests/fixtures/ministry_of_power/whats_new_archive_page.json
          - tests/fixtures/ministry_of_power/archive_counts.json
          - tests/fixtures/ministry_of_power/browser_block.html
        verified: true
        last_verified: '2026-10-22'
      - id: mop_document_taxonomy
        purpose: Discover and validate Ministry document-category slugs.
        url: https://www.powermin.gov.in/cms/wp-json/taxonomy/documents_category
        discovery_method: api
        kind: discovery
        decision: indirect
        enumeration: {method: API response, termination: response end}
        identity: {native_ids: [term id, slug], fallback: source-scoped slug}
        date_semantics: {displayed: none, first_seen: tracker discovery time}
        expected_mime_types: [application/json]
        language_behavior: Taxonomy metadata is expected in English.
        refresh_policy: {weekly: validate configured terms, historical: not applicable}
        completeness:
          removal_authority: false
          failure_indicators: [HTTP block page, non-JSON response, malformed JSON]
        history: {boundary: current taxonomy snapshot contained 16 terms, boundary_verified: true}
        evidence_urls: [https://www.powermin.gov.in/cms/wp-json/taxonomy/documents_category]
        fixtures:
          - tests/fixtures/ministry_of_power/taxonomy.json
          - tests/fixtures/ministry_of_power/browser_block.html
        verified: true
        last_verified: '2026-10-22'
      - id: mop_documents
        purpose: Enumerate published and archived document parents and attachments in each selected category.
        url_template: https://www.powermin.gov.in/cms/wp-json/document/documents?document_category={category}&limit={limit}&page={page}
        archive_url_template: https://www.powermin.gov.in/cms/wp-json/document/documents?document_category={category}&limit={limit}&page={page}&post_status=archive
        discovery_method: api
        kind: authoritative_collection
        decision: track
        categories:
          - reports
          - acts-and-policy
          - orders-and-notices
          - gazette-notifications
          - guidelines
          - publications
        status_passes: [publish, archive]
        enumeration:
          method: Two page-parameter passes per taxonomy slug; the published pass uses url_template and the archive pass adds post_status=archive
          termination: Each pass ends when current_page reaches total_pages; the following page returns an empty posts array; a pass with total_items=0 and total_pages=0 is complete
        identity: {native_ids: [parent post id, attachment post id], fallback: source-scoped canonical URL}
        date_semantics: {displayed: publication date, modified: API modified timestamp, status: post_status publish or archive; a move between them is a status change and never removal or publication, first_seen: tracker discovery time}
        expected_mime_types: [application/json]
        language_behavior: Preserve English listing metadata for English, Hindi, bilingual, scanned, or unreadable files.
        refresh_policy: {weekly: fully enumerate both status passes and revisit active/current parents, historical: quarterly full parent rescan of both passes}
        completeness:
          removal_authority: true
          removal_rule: A parent is removed only when absent from both the published and archive passes in two consecutive complete enumerations
          child_term_reconciliation: Weekly, for every taxonomy term whose parent is a selected root, count root-enumerated posts (both passes) carrying that child term and compare with the taxonomy child count; a lower root-side count means child-only tagged posts are hidden because child-slug queries return zero items
          failure_indicators: [HTTP block page, non-JSON response, malformed JSON, pagination gap, archive-pass pagination gap, row-count collapse, child-term reconciliation mismatch (root-enumerated posts carrying a child term fewer than that child's taxonomy count)]
        history:
          boundary: published reports=9 parents; acts-and-policy=7; orders-and-notices=4; gazette-notifications=0; guidelines=0; publications=0. Archived acts-and-policy=2; all other selected roots=0
          boundary_verified: true
